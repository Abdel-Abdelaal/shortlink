[project]
name = "shortlink"
version = "0.1.0"
description = "A small URL shortener demonstrating production engineering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.162", "pydantic-settings>=2.16"]

[dependency-groups]
dev = ["ruff>=0.17", "pyright>=1.1.414", "pytest>=9.1", "pytest-cov>=7.1", "httpx>=0.28", "pre-commit>=4.7", "commitizen>=4.19"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","N","D","UP","B","SIM","C90","PL","ANN","ERA","TD","BLE","TRY","S","RUF","PT","RET","ARG","PTH","DTZ","T20","FBT"]
ignore = ["D203","D213","TD003"]
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","D","PLR2004","ANN"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["shortlink"]
branch = true
[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.commitizen]
name = "cz_conventional_commits"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortlink"]
