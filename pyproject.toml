[project]
name = "shortlink"
version = "0.1.0"
description = "A small URL shortener demonstrating production engineering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.162", "pydantic>=2.14.1", "pydantic-settings>=2.16", "starlette>=1.10.0"]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "httpx>=0.28",
    "pre-commit>=4.7",
    "commitizen>=4.19",
    "hypothesis>=6.170.1",
    "schemathesis>=4.31.1",
    "import-linter>=2.15",
    "deptry>=0.25.1",
    "vulture>=2.16",
]

[tool.ruff]
extend = "ruff-base.toml"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["TD", "FBT"]
ignore = ["D203","D213","TD003"]
[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101","D","PLR2004","ANN"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["shortlink"]
branch = true
[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.importlinter]
root_package = "shortlink"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain rules depend on nothing outside the domain"
type = "forbidden"
source_modules = ["shortlink.domain"]
forbidden_modules = ["shortlink.api", "shortlink.db", "shortlink.main", "fastapi", "starlette", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on each other"
type = "independence"
modules = ["shortlink.api", "shortlink.db"]

[tool.deptry]
known_first_party = ["shortlink"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80

[tool.commitizen]
name = "cz_conventional_commits"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortlink"]
