[project]
name = "shortlink"
version = "0.1.0"
description = "A small URL shortener API, used to show production-grade CI/CD."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortlink"]
