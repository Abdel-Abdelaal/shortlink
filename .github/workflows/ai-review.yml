name: AI coding review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id != 49699333
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-review.yml@5f38daccd8b114293bd486da44f9c9e31e4feb30 # reviewed security candidate; release verification
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
