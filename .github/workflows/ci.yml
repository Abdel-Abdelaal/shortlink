name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@c0d3bb1d4a3e0fef8ffd893d33adccea286a4eba # pre-release test of platform PR 26
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@e26d5b07bdee2fc54ed5bd607d8041f7fbeaadaf # v1.5.0
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
