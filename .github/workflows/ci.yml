name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@40e5261e2e39d8d0c88e709c26385cab3cc43466 # v1.7.0
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@40e5261e2e39d8d0c88e709c26385cab3cc43466 # v1.7.0
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
