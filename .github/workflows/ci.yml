name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@c047928d7555f1f9e6e2ab56e6e9d3bfa79cdc2c # v1.2.0
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@c047928d7555f1f9e6e2ab56e6e9d3bfa79cdc2c # v1.2.0
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
