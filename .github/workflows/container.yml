name: Container delivery
on:
  pull_request:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, 'src/**', 'tests/container_smoke.py', pyproject.toml, uv.lock, '.github/workflows/container.yml']
  release:
    types: [published]
  schedule:
    - cron: '40 4 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Build, smoke and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require released source to be reviewed on main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: shortlink:ci
          provenance: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify non-root, read-only operation and SQLite restart persistence
        run: |
          test "$(docker image inspect shortlink:ci --format '{{.Config.User}}')" = '10001:10001'
          docker volume create shortlink-data
          docker run --detach --name shortlink --publish 127.0.0.1:8000:8000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount source=shortlink-data,target=/data shortlink:ci
          trap 'docker logs shortlink; docker rm --force shortlink; docker volume rm shortlink-data' EXIT
          python tests/container_smoke.py create
          docker restart shortlink
          python tests/container_smoke.py persisted
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: shortlink:ci
          format: json
          output: trivy.json
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: shortlink:ci
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-reports
          path: |
            trivy.json
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save the tested image for this release only
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: docker save shortlink:ci --output "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release' && !github.event.release.prerelease
        with:
          name: tested-release-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
  publish:
    name: Publish tested image and attestations
    needs: validate
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release-image
          path: payload
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-reports
          path: reports
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the exact tested image
        id: push
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker load --input payload/image.tar
          image="ghcr.io/abdel-abdelaal/shortlink:$RELEASE_TAG"
          docker tag shortlink:ci "$image"
          docker push "$image"
          reference=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          digest="${reference##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published tested image: $reference" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/abdel-abdelaal/shortlink
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/abdel-abdelaal/shortlink
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: reports/sbom.cdx.json
          push-to-registry: true
      - name: Attach SBOM and scan evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" reports/sbom.cdx.json reports/trivy.json --clobber
  report:
    needs: [validate, publish]
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@9963dc1ffc49cff752cc62f2ec9c1651bdb3f482 # v1.6.0
    permissions:
      issues: write
    with:
      title: Scheduled container security validation failed
