name: Release proposals
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/release.yml@0b7cd6a33abb89db1743c91d3f11cf98179ebcd2 # v1.9.0
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
