name: Release proposals
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/release.yml@f5e165971bf42fd3e5363ebd7baa0d827f81951c # v1.11.0
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
