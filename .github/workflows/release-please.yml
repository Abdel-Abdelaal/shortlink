name: Release proposals
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/release.yml@fac9ee28b0217a9d65e97a866bb87dfe1b92b0f2 # v1.7.0
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
